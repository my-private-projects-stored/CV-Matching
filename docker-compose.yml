name: cv-matching

services:
  mongo:
    image: mongo:7
    container_name: cvm-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cvm_net

  redis:
    image: redis:7-alpine
    container_name: cvm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - cvm_net

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: cvm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cvm_net

  gateway-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: cvm-gateway-backend
    working_dir: /workspace
    command: ["sh", "-c", "npm run bootstrap:qdrant && npm run dev"]
    volumes:
      - ./apps/backend:/workspace
      - backend_node_modules:/workspace/node_modules
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://worker-embedding-sbert:8010
      PARSING_SERVICE_URL: http://worker-parsing:8020
      SCORING_QUEUE_NAME: application_scoring_queue
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: "3001"
    ports:
      - "3001:3001"
    develop:
      watch:
        - action: sync+restart
          path: ./apps/backend
          target: /workspace
          ignore:
            - node_modules/
            - coverage/
            - .git/
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./apps/backend/package-lock.json
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      worker-embedding-sbert:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - cvm_net
    profiles:
      - app

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: cvm-frontend
    working_dir: /workspace
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./apps/frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
      - /workspace/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      INTERNAL_API_BASE_URL: http://gateway-backend:3001
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      NEXT_WEBPACK_USEPOLLING: "1"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./apps/frontend
          target: /workspace
          ignore:
            - node_modules/
            - .next/
            - coverage/
            - .git/
        - action: rebuild
          path: ./apps/frontend/package.json
        - action: rebuild
          path: ./apps/frontend/package-lock.json
    depends_on:
      gateway-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - cvm_net
    profiles:
      - app

  worker-parsing:
    build:
      context: ./workers/parsing
    container_name: cvm-worker-parsing
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8020:8020"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=2)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cvm_net
    profiles:
      - app
      - workers

  worker-scoring:
    build:
      context: ./workers/scoring
    container_name: cvm-worker-scoring
    environment:
      REDIS_URL: redis://redis:6379
      SCORING_QUEUE_NAME: application_scoring_queue
      SCORING_DLQ_NAME: application_scoring_queue_dlq
      SCORING_QUEUE_MAX_RETRIES: "3"
      SCORING_RETRY_BACKOFF_MODE: linear
      SCORING_RETRY_BACKOFF_MS: "1000"
      SCORING_RETRY_BACKOFF_MAX_MS: "10000"
      SCORING_METRICS_LOG_INTERVAL_MS: "30000"
      BACKEND_INTERNAL_BASE_URL: http://gateway-backend:3001/api/internal
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
    depends_on:
      redis:
        condition: service_healthy
      gateway-backend:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - workers

  worker-notification:
    build:
      context: ./workers/notification
    container_name: cvm-worker-notification
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin
      NOTIFICATION_QUEUE_NAME: notification_queue
      NOTIFICATION_DLQ_NAME: notification_queue_dlq
      NOTIFICATION_MAX_RETRIES: "3"
      NOTIFICATION_METRICS_LOG_INTERVAL_MS: "30000"
      # SMTP — leave SMTP_HOST blank to run in no-op (log-only) mode
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"CV Matching Platform <noreply@cv-matching.local>"}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#1D4ED8}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      gateway-backend:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - workers

  worker-embedding-sbert:
    build:
      context: ./workers/embedding-sbert
    container_name: cvm-worker-embedding-sbert
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cvm_net
    profiles:
      - app
      - workers

  upstream-ai-core:
    build:
      context: ./upstream/resume-matcher/apps/backend
    container_name: cvm-upstream-ai-core
    environment:
      ENVIRONMENT: development
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    networks:
      - cvm_net
    profiles:
      - upstream

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  cvm_net:
    driver: bridge
