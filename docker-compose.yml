name: cv-matching

services:
  mongo:
    image: mongo:8
    container_name: cvm-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:-cvmDevReplicaSetKey0123456789abcdef0123456789abcdef}
    entrypoint:
      - /bin/bash
      - -c
      - |
        printf "%s\n" "$${MONGO_REPLICA_KEY:-cvmDevReplicaSetKey0123456789abcdef0123456789abcdef}" > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cvm_net

  mongo-init-replica:
    image: mongo:8
    container_name: cvm-mongo-init-replica
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - ./infra/mongo/init-replica.js:/init-replica.js:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        mongosh "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/admin?authSource=admin&directConnection=true" /init-replica.js
    networks:
      - cvm_net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cvm-minio
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "/usr/bin/minio", "--version" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cvm_net

  minio-init:
    image: node:20-alpine
    container_name: cvm-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - node
      - -e
      - |
        const wait = async () => {
          for (let i = 0; i < 30; i++) {
            try {
              const r = await fetch("http://minio:9000/minio/health/live");
              if (r.ok) { console.log("[minio-init] MinIO S3 is live."); process.exit(0); }
            } catch {}
            await new Promise((r) => setTimeout(r, 1000));
          }
          console.error("[minio-init] Timed out waiting for MinIO");
          process.exit(1);
        };
        wait();
    networks:
      - cvm_net

  redis:
    image: redis:7-alpine
    container_name: cvm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - cvm_net

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: cvm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cvm_net

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: cvm-auth-service
    environment:
      NODE_ENV: development
      PORT: "5001"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin&replicaSet=rs0
      SERVICE_DB_NAME: cvm_auth
      REDIS_URL: redis://redis:6379
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
      INTERNAL_ACCESS_CHECK_URL: http://application-service:5004/internal/access-check
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  resume-service:
    build:
      context: .
      dockerfile: services/resume-service/Dockerfile
    container_name: cvm-resume-service
    environment:
      NODE_ENV: development
      PORT: "5002"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin&replicaSet=rs0
      SERVICE_DB_NAME: cvm_resume
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      PARSING_SERVICE_URL: http://worker-parsing:8020
      EMBEDDING_SERVICE_URL: http://worker-embedding-sbert:8010
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
      INTERNAL_ACCESS_CHECK_URL: http://application-service:5004/internal/access-check
    ports:
      - "5002:5002"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  job-service:
    build:
      context: .
      dockerfile: services/job-service/Dockerfile
    container_name: cvm-job-service
    environment:
      NODE_ENV: development
      PORT: "5003"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin&replicaSet=rs0
      SERVICE_DB_NAME: cvm_job
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      EMBEDDING_SERVICE_URL: http://worker-embedding-sbert:8010
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
    ports:
      - "5003:5003"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  application-service:
    build:
      context: .
      dockerfile: services/application-service/Dockerfile
    container_name: cvm-application-service
    environment:
      NODE_ENV: development
      PORT: "5004"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin&replicaSet=rs0
      SERVICE_DB_NAME: cvm_application
      REDIS_URL: redis://redis:6379
      SCORING_QUEUE_NAME: application_scoring_queue
      RESUME_SERVICE_URL: http://resume-service:5002
      JOB_SERVICE_URL: http://job-service:5003
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
    ports:
      - "5004:5004"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    container_name: cvm-recommendation-service
    environment:
      NODE_ENV: development
      PORT: "5005"
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      JOB_SERVICE_URL: http://job-service:5003
      RESUME_SERVICE_URL: http://resume-service:5002
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
    ports:
      - "5005:5005"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  ai-enrichment-service:
    build:
      context: .
      dockerfile: services/ai-enrichment-service/Dockerfile
    container_name: cvm-ai-enrichment-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: "5006"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin&replicaSet=rs0
      SERVICE_DB_NAME: cvm_enrichment
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "5006:5006"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: cvm-notification-service
    environment:
      NODE_ENV: development
      PORT: "5007"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin&replicaSet=rs0
      SERVICE_DB_NAME: cvm_notification
      REDIS_URL: redis://redis:6379
      NOTIFICATION_QUEUE_NAME: notification_queue
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
    ports:
      - "5007:5007"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  config-analytics-service:
    build:
      context: .
      dockerfile: services/config-analytics-service/Dockerfile
    container_name: cvm-config-analytics-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: "5008"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/?authSource=admin&replicaSet=rs0
      SERVICE_DB_NAME: cvm_config
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://worker-embedding-sbert:8010
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "5008:5008"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: cvm-api-gateway
    environment:
      NODE_ENV: development
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-gateway-secret}
      AUTH_SERVICE_URL: http://auth-service:5001
      RESUME_SERVICE_URL: http://resume-service:5002
      JOB_SERVICE_URL: http://job-service:5003
      APPLICATION_SERVICE_URL: http://application-service:5004
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:5005
      AI_ENRICHMENT_SERVICE_URL: http://ai-enrichment-service:5006
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
      CONFIG_ANALYTICS_SERVICE_URL: http://config-analytics-service:5008
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      resume-service:
        condition: service_started
      job-service:
        condition: service_started
      application-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      ai-enrichment-service:
        condition: service_started
      notification-service:
        condition: service_started
      config-analytics-service:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: cvm-frontend
    working_dir: /workspace
    command: [ "npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000" ]
    volumes:
      - ./apps/frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
      - /workspace/.next
    environment:
      NODE_ENV: development
      BACKEND_ORIGIN: http://api-gateway:3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      INTERNAL_API_BASE_URL: http://api-gateway:3001
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      NEXT_WEBPACK_USEPOLLING: "1"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - cvm_net
    profiles:
      - app
      - microservices

  worker-parsing:
    build:
      context: ./workers/parsing
    container_name: cvm-worker-parsing
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8020:8020"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=2)\"" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cvm_net
    profiles:
      - app
      - workers
      - microservices

  worker-embedding-sbert:
    build:
      context: ./workers/embedding-sbert
    container_name: cvm-worker-embedding-sbert
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8010:8010"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)\"" ]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 120s
    networks:
      - cvm_net
    profiles:
      - app
      - workers
      - microservices

  worker-scoring:
    build:
      context: ./workers/scoring
    container_name: cvm-worker-scoring
    environment:
      REDIS_URL: redis://redis:6379
      SCORING_QUEUE_NAME: application_scoring_queue
      RESUME_SERVICE_URL: http://resume-service:5002
      JOB_SERVICE_URL: http://job-service:5003
      QDRANT_URL: http://qdrant:6333
      SCORING_PROCESSING_QUEUE_NAME: application_scoring_queue_processing
      SCORING_DLQ_NAME: application_scoring_queue_dlq
      SCORING_QUEUE_MAX_RETRIES: "3"
      SCORING_RETRY_BACKOFF_MODE: linear
      SCORING_RETRY_BACKOFF_MS: "1000"
      SCORING_RETRY_BACKOFF_MAX_MS: "10000"
      SCORING_VISIBILITY_TIMEOUT_MS: "60000"
      SCORING_RECOVERY_INTERVAL_MS: "60000"
      HYBRID_SEMANTIC_WEIGHT: "0.65"
      SCORING_METRICS_PORT: "9101"
      SCORING_METRICS_LOG_INTERVAL_MS: "30000"
      BACKEND_INTERNAL_BASE_URL: http://application-service:5004/api/internal
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
    ports:
      - "9101:9101"
    depends_on:
      redis:
        condition: service_healthy
      application-service:
        condition: service_started
    networks:
      - cvm_net
    profiles:
      - app
      - workers
      - microservices

  worker-notification:
    build:
      context: ./workers/notification
    container_name: cvm-worker-notification
    environment:
      REDIS_URL: redis://redis:6379
      LEGACY_DIRECT_MONGO: "0"
      NOTIFICATION_QUEUE_NAME: notification_queue
      NOTIFICATION_PROCESSING_QUEUE_NAME: notification_queue_processing
      NOTIFICATION_DLQ_NAME: notification_queue_dlq
      NOTIFICATION_MAX_RETRIES: "3"
      NOTIFICATION_VISIBILITY_TIMEOUT_MS: "60000"
      NOTIFICATION_RECOVERY_INTERVAL_MS: "60000"
      NOTIFICATION_METRICS_PORT: "9102"
      NOTIFICATION_METRICS_LOG_INTERVAL_MS: "30000"
      NOTIFICATION_INTERNAL_BASE_URL: http://notification-service:5007/internal
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"CV Matching Platform <noreply@cv-matching.local>"}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#1D4ED8}
    ports:
      - "9102:9102"
    depends_on:
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - cvm_net
    profiles:
      - app
      - workers
      - microservices

  upstream-ai-core:
    build:
      context: ./upstream/resume-matcher/apps/backend
    container_name: cvm-upstream-ai-core
    environment:
      ENVIRONMENT: development
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    networks:
      - cvm_net
    profiles:
      - upstream

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
  minio_data:
  frontend_node_modules:

networks:
  cvm_net:
    driver: bridge
