      - name: Replay-audit status summary
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/replay-audit-ci.jsonl
          echo "Replay audit status counts:"
          awk 'NF { print $0 }' scripts/replay-audit-ci.jsonl \
            | jq -r '.status' \
            | sort \
            | uniq -c

      - name: Replay-audit status threshold checks
        shell: bash
        env:
          REPLAY_AUDIT_PROFILE: "ci"
          REPLAY_AUDIT_MAX_EXECUTED: ""
          REPLAY_AUDIT_MAX_NO_OP: ""
          REPLAY_AUDIT_MIN_DRY_RUN: ""
        run: |
          set -euo pipefail
          test -f scripts/replay-audit-ci.jsonl

          profile=$(echo "${REPLAY_AUDIT_PROFILE:-ci}" | tr '[:upper:]' '[:lower:]')
          case "$profile" in
            local)
              default_max_executed=3
              default_max_no_op=20
              default_min_dry_run=0
              ;;
            staging)
              default_max_executed=1
              default_max_no_op=10
              default_min_dry_run=1
              ;;
            ci|*)
              default_max_executed=0
              default_max_no_op=5
              default_min_dry_run=1
              ;;
          esac

          max_executed=${REPLAY_AUDIT_MAX_EXECUTED:-$default_max_executed}
          max_no_op=${REPLAY_AUDIT_MAX_NO_OP:-$default_max_no_op}
          min_dry_run=${REPLAY_AUDIT_MIN_DRY_RUN:-$default_min_dry_run}

          status_counts=$(awk 'NF { print $0 }' scripts/replay-audit-ci.jsonl | jq -r '.status' | sort | uniq -c)
          echo "$status_counts"

          executed_count=$(echo "$status_counts" | awk '$2=="executed" {print $1}' | tail -n1)
          no_op_count=$(echo "$status_counts" | awk '$2=="no-op" {print $1}' | tail -n1)
          dry_run_count=$(echo "$status_counts" | awk '$2=="dry-run" {print $1}' | tail -n1)

          executed_count=${executed_count:-0}
          no_op_count=${no_op_count:-0}
          dry_run_count=${dry_run_count:-0}

          echo "Replay-audit threshold profile=$profile executed<=$max_executed no-op<=$max_no_op dry-run>=$min_dry_run"

          if (( executed_count > max_executed )); then
            echo "Replay audit anomaly: executed_count=$executed_count exceeds threshold=$max_executed"
            exit 1
          fi

          if (( no_op_count > max_no_op )); then
            echo "Replay audit anomaly: no_op_count=$no_op_count exceeds threshold=$max_no_op"
            exit 1
          fi

          if (( dry_run_count < min_dry_run )); then
            echo "Replay audit anomaly: dry_run_count=$dry_run_count below threshold=$min_dry_run"
            exit 1
          fi

      - name: Upload replay-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-audit-ci
          path: scripts/replay-audit-ci.jsonl
          if-no-files-found: warn

      - name: Upload queue-load trend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-load-trend
          path: |
            scripts/queue-load-trend.log
            scripts/queue-load-trend.jsonl
            scripts/queue-load-trend-history-*.jsonl
            scripts/queue-load-baseline-suggestion.json
          if-no-files-found: warn

      - name: Summarize CSV-focused integration diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "### CSV-focused backend integration"
            if [ -f scripts/csv-focused-integration.log ]; then
              TEST_COUNT=$(grep -Eo 'tests[[:space:]]+[0-9]+' scripts/csv-focused-integration.log | tail -n 1 | awk '{print $2}' || true)
              PASS_COUNT=$(grep -Eo 'pass[[:space:]]+[0-9]+' scripts/csv-focused-integration.log | tail -n 1 | awk '{print $2}' || true)
              FAIL_COUNT=$(grep -Eo 'fail[[:space:]]+[0-9]+' scripts/csv-focused-integration.log | tail -n 1 | awk '{print $2}' || true)

              echo "- Artifact: backend-csv-integration-log"
              echo "- Log path: scripts/csv-focused-integration.log"
              if [ -n "${TEST_COUNT:-}" ] || [ -n "${PASS_COUNT:-}" ] || [ -n "${FAIL_COUNT:-}" ]; then
                echo "- Parsed results: tests=${TEST_COUNT:-unknown}, pass=${PASS_COUNT:-unknown}, fail=${FAIL_COUNT:-unknown}"
              fi
              if [[ "${FAIL_COUNT:-}" =~ ^[0-9]+$ ]] && [ "${FAIL_COUNT}" -gt 0 ]; then
                echo "- WARNING: CSV-focused suite reported failing tests; use the reproduce command below."
              fi
              echo "- Local reproduce command:"
              echo '```bash'
              echo 'cd apps/backend'
              echo 'RUN_INTEGRATION_TESTS=1 MONGO_URI="mongodb://admin:admin123@127.0.0.1:27017/?authSource=admin" MONGO_URI_TEST="mongodb://admin:admin123@127.0.0.1:27017/?authSource=admin" REDIS_URL="redis://127.0.0.1:6379" QDRANT_URL="http://127.0.0.1:6333" EMBEDDING_SERVICE_URL="http://127.0.0.1:8010" npm run test:integration:csv'
              echo '```'
              echo "- Last 20 log lines:"
              echo '```text'
              tail -n 20 scripts/csv-focused-integration.log
              echo '```'
            else
              echo "- CSV-focused log file was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CSV-focused integration log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-csv-integration-log
          path: scripts/csv-focused-integration.log
          if-no-files-found: warn

      - name: Upload integration log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-log
          path: scripts/last-backend-integration.txt
          if-no-files-found: warn

      - name: Smoke runtime endpoints
        working-directory: apps/backend
        env:
          MONGO_URI: mongodb://admin:admin123@127.0.0.1:27017/?authSource=admin
          EMBEDDING_SERVICE_URL: http://127.0.0.1:8010
          PORT: "3001"
        shell: bash
        run: |
          set -euo pipefail

          npm run start > /tmp/backend-smoke.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" >/dev/null 2>&1 || true' EXIT

          for i in {1..30}; do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf "http://127.0.0.1:${PORT}/api/health"
          curl -sf "http://127.0.0.1:${PORT}/api/status"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  isolated-critical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - auth-endpoints.test.mjs
          - application-authorization.test.mjs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Ensure jq is available
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Start mongo for isolated test
        run: docker compose --profile app up -d mongo

      - name: Wait for mongo healthy
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            out=$(docker compose ps --format json)
            mongo_ok=$(echo "$out" | jq -r 'map(select(.Name=="cvm-mongo"))[0].Health // ""')
            if [[ "$mongo_ok" == "healthy" ]]; then
              echo "Mongo is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Mongo did not become healthy in time"
          docker compose ps
          docker compose logs --tail 100 mongo
          exit 1

      - name: Run isolated critical integration test
        working-directory: apps/backend
        shell: bash
        env:
          RUN_INTEGRATION_TESTS: "1"
          MONGO_URI: mongodb://admin:admin123@127.0.0.1:27017/?authSource=admin
          MONGO_URI_TEST: mongodb://admin:admin123@127.0.0.1:27017/?authSource=admin
          EMBEDDING_SERVICE_URL: http://127.0.0.1:8010
        run: |
          set -euo pipefail
          mkdir -p ../../scripts/isolated-test-logs
          node --test tests/integration/${{ matrix.test_file }} \
            2>&1 | tee ../../scripts/isolated-test-logs/${{ matrix.test_file }}.log

      - name: Upload isolated test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-integration-log-${{ matrix.test_file }}
          path: scripts/isolated-test-logs/${{ matrix.test_file }}.log
          if-no-files-found: warn

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
