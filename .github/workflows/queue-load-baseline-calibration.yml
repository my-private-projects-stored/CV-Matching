      - name: Validate calibration decision documentation anchors
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/queue-load-baseline-calibration-decision.json
          test -f README.md

          schema_version=$(jq -r '.schema_version' scripts/queue-load-baseline-calibration-decision.json)

          grep -q 'schema_version' README.md
          grep -q "$schema_version" README.md
          grep -q 'environment_profile' README.md
          grep -q 'threshold_profile' README.md
          grep -q 'sample_counts_by_tier' README.md

      - name: Upload nightly calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-load-baseline-calibration
          path: |
            scripts/queue-load-baseline-suggestion-nightly.json
            scripts/queue-load-baseline-current.json
            scripts/queue-load-baseline-calibration-decision.json
          if-no-files-found: warn

      - name: Create baseline update pull request
        if: (env.QUEUE_BASELINE_UPDATE_APPLIED == 'True' || env.QUEUE_BASELINE_UPDATE_APPLIED == 'true') && (env.NIGHTLY_BASELINE_CREATE_PULL_REQUEST == 'True' || env.NIGHTLY_BASELINE_CREATE_PULL_REQUEST == 'true')
        uses: peter-evans/create-pull-request@v6
        with:
